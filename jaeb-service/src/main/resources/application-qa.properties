# ===========================
# QA / Staging Profile
# ===========================
# H2 file DB, moderate logging, API key enabled, polling enabled.
# Run with: --spring.profiles.active=qa

server.port=8081

# Database: H2 file-based (separate from local)
spring.datasource.url=jdbc:h2:file:./data/edi-service-qa;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=qaPassword123

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console: enabled for QA debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf: cache enabled for performance
spring.thymeleaf.cache=true

# Logging: moderate
logging.level.javax.edi=INFO
logging.level.org.springframework.web=INFO
logging.level.EDI_AUDIT=INFO

# Security: API key enabled
edi.security.api-key-enabled=true
edi.security.api-key=qa-secret-key-change-me
edi.security.rate-limit-enabled=true
edi.security.rate-limit-per-minute=200

# Channel polling: enabled for integration testing
edi.channel.polling-enabled=true
edi.channel.poll-interval-ms=60000
edi.channel.initial-delay-ms=15000
edi.sftp.polling-enabled=false
