# ===========================
# LOCAL Development Profile
# ===========================
# H2 in-memory/file DB, debug logging, no security, cache off.
# Run with: --spring.profiles.active=local (default)

# Database: H2 file-based (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/edi-service-local;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf: no cache for live reload
spring.thymeleaf.cache=false

# Logging: verbose for development
logging.level.javax.edi=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.EDI_AUDIT=DEBUG

# Security: disabled for easy local testing
edi.security.api-key-enabled=false
edi.security.api-key=dev-local-key
edi.security.rate-limit-enabled=false
edi.security.rate-limit-per-minute=1000

# Channel polling: disabled locally
edi.channel.polling-enabled=false
edi.sftp.polling-enabled=false
