<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Partner' : 'Onboard Partner'">Partner — JAEB EDI Platform</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<nav th:replace="fragments/layout :: sidebar"></nav>
<div class="main">
    <div class="topbar">
        <h1>
            <a th:href="@{/ui/partners}" style="text-decoration:none;color:var(--gray-400)">&larr;</a>
            &nbsp;<span th:text="${isEdit} ? 'Edit Partner' : 'Onboard New Partner'"></span>
        </h1>
    </div>
    <div class="content">

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card">
            <div class="card-header">
                <h3 th:text="${isEdit} ? 'Partner Configuration' : 'Partner Details'"></h3>
            </div>
            <div class="card-body">
                <form th:action="${isEdit} ? @{/ui/partners/{id}/edit(id=${partner.partnerId})} : @{/ui/partners/new}"
                      method="post">

                    <div class="form-grid">
                        <!-- Basic -->
                        <div class="form-group">
                            <label>Partner ID *</label>
                            <input type="text" name="partnerId" th:value="${partner.partnerId}"
                                   required th:readonly="${isEdit}" placeholder="e.g. WALMART-US">
                        </div>
                        <div class="form-group">
                            <label>Partner Name *</label>
                            <input type="text" name="partnerName" th:value="${partner.partnerName}"
                                   required placeholder="e.g. Walmart Inc.">
                        </div>

                        <!-- ISA/GS -->
                        <div class="form-group">
                            <label>ISA ID</label>
                            <input type="text" name="isaId" th:value="${partner.isaId}"
                                   placeholder="ISA06/ISA08" maxlength="15">
                        </div>
                        <div class="form-group">
                            <label>ISA Qualifier</label>
                            <input type="text" name="isaIdQualifier" th:value="${partner.isaIdQualifier}"
                                   placeholder="e.g. ZZ, 01" maxlength="2">
                        </div>
                        <div class="form-group">
                            <label>GS Application Code</label>
                            <input type="text" name="gsApplicationCode" th:value="${partner.gsApplicationCode}"
                                   placeholder="e.g. SENDER01" maxlength="15">
                        </div>
                        <div class="form-group">
                            <label>Supported Txn Types</label>
                            <input type="text" name="supportedTransactionTypes"
                                   th:value="${partner.supportedTransactionTypes}"
                                   placeholder="e.g. 850,810,856">
                        </div>

                        <!-- Delimiters -->
                        <div class="form-group">
                            <label>Element Delimiter</label>
                            <input type="text" name="elementDelimiter" th:value="${partner.elementDelimiter}"
                                   placeholder="* (default)" maxlength="1">
                        </div>
                        <div class="form-group">
                            <label>Segment Delimiter</label>
                            <input type="text" name="segmentDelimiter" th:value="${partner.segmentDelimiter}"
                                   placeholder="~ (default)" maxlength="1">
                        </div>
                        <div class="form-group">
                            <label>Component Delimiter</label>
                            <input type="text" name="componentDelimiter" th:value="${partner.componentDelimiter}"
                                   placeholder="> (default)" maxlength="1">
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select name="status">
                                <option value="ONBOARDING" th:selected="${partner.status?.name() == 'ONBOARDING'}">Onboarding</option>
                                <option value="ACTIVE" th:selected="${partner.status?.name() == 'ACTIVE'}">Active</option>
                                <option value="SUSPENDED" th:selected="${partner.status?.name() == 'SUSPENDED'}">Suspended</option>
                                <option value="INACTIVE" th:selected="${partner.status?.name() == 'INACTIVE'}">Inactive</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Auto-Acknowledge (997)</label>
                            <select name="autoAcknowledge">
                                <option value="true" th:selected="${partner.autoAcknowledge}">Yes — auto-generate 997</option>
                                <option value="false" th:selected="${!partner.autoAcknowledge}">No</option>
                            </select>
                        </div>

                        <!-- Contact -->
                        <div class="form-group">
                            <label>Contact Email</label>
                            <input type="email" name="contactEmail" th:value="${partner.contactEmail}"
                                   placeholder="edi-support@partner.com">
                        </div>
                        <div class="form-group full">
                            <label>Notes</label>
                            <textarea name="notes" th:text="${partner.notes}" placeholder="Internal notes..."></textarea>
                        </div>
                    </div>

                    <!-- ===== Communication Channel (inline during onboarding) ===== -->
                    <div class="card" style="margin-top:24px;border:1px solid var(--gray-200)">
                        <div class="card-header">
                            <h3>Communication Channel</h3>
                            <small style="color:var(--gray-400);font-weight:400">Configure the primary communication channel for this partner (optional — you can add more later)</small>
                        </div>
                        <div class="card-body">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Channel Name</label>
                                    <input type="text" name="ch_channelName" th:value="${channel?.channelName}"
                                           placeholder="e.g. Walmart AS2 Inbound">
                                </div>
                                <div class="form-group">
                                    <label>Protocol</label>
                                    <select name="ch_protocol" id="protocolSelect" onchange="toggleProtocolFields()">
                                        <option value="">— None (skip) —</option>
                                        <option value="SFTP" th:selected="${channel?.protocol?.name() == 'SFTP'}">SFTP</option>
                                        <option value="FTP" th:selected="${channel?.protocol?.name() == 'FTP'}">FTP</option>
                                        <option value="AS2" th:selected="${channel?.protocol?.name() == 'AS2'}">AS2</option>
                                        <option value="HTTP" th:selected="${channel?.protocol?.name() == 'HTTP'}">HTTP</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Direction</label>
                                    <select name="ch_direction">
                                        <option value="INBOUND" th:selected="${channel?.direction?.name() == 'INBOUND'}">Inbound (receive)</option>
                                        <option value="OUTBOUND" th:selected="${channel?.direction?.name() == 'OUTBOUND'}">Outbound (send)</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Status</label>
                                    <select name="ch_status">
                                        <option value="ACTIVE" th:selected="${channel?.status?.name() == 'ACTIVE'}">Active</option>
                                        <option value="DISABLED" th:selected="${channel?.status?.name() == 'DISABLED'}">Disabled</option>
                                    </select>
                                </div>
                            </div>

                            <!-- ===== SFTP / FTP Fields ===== -->
                            <div id="sftpFields" style="display:none">
                                <div class="form-group full" style="margin-top:16px">
                                    <label style="font-size:.85rem;font-weight:700;color:var(--gray-800)">
                                        <span id="protocolLabel">SFTP</span> Connection
                                    </label>
                                </div>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label>Host</label>
                                        <input type="text" name="ch_host" th:value="${channel?.host}" placeholder="sftp.partner.com">
                                    </div>
                                    <div class="form-group">
                                        <label>Port</label>
                                        <input type="number" name="ch_port" th:value="${channel?.port}" placeholder="22">
                                    </div>
                                    <div class="form-group">
                                        <label>Username</label>
                                        <input type="text" name="ch_username" th:value="${channel?.username}">
                                    </div>
                                    <div class="form-group">
                                        <label>Password</label>
                                        <input type="password" name="ch_password" th:value="${channel?.password}">
                                    </div>
                                    <div class="form-group">
                                        <label>Remote Directory</label>
                                        <input type="text" name="ch_remoteDirectory" th:value="${channel?.remoteDirectory}" placeholder="/edi/inbound">
                                    </div>
                                    <div class="form-group">
                                        <label>Archive Directory</label>
                                        <input type="text" name="ch_archiveDirectory" th:value="${channel?.archiveDirectory}" placeholder="/edi/archive">
                                    </div>
                                    <div class="form-group">
                                        <label>File Pattern</label>
                                        <input type="text" name="ch_filePattern" th:value="${channel?.filePattern}" placeholder="*.edi">
                                    </div>
                                    <div class="form-group" id="ftpOptions" style="display:none">
                                        <label>FTP Options</label>
                                        <label style="font-weight:400;font-size:.82rem">
                                            <input type="checkbox" name="ch_passiveMode" th:checked="${channel?.passiveMode}"> Passive Mode
                                        </label>
                                        <label style="font-weight:400;font-size:.82rem">
                                            <input type="checkbox" name="ch_useTls" th:checked="${channel?.useTls}"> Use TLS (FTPS)
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- ===== AS2 Fields ===== -->
                            <div id="as2Fields" style="display:none">
                                <div class="form-group full" style="margin-top:16px">
                                    <label style="font-size:.85rem;font-weight:700;color:var(--gray-800)">AS2 Configuration</label>
                                </div>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label>Local AS2 ID</label>
                                        <input type="text" name="ch_as2LocalId" th:value="${channel?.as2LocalId}" placeholder="MY-AS2-ID">
                                    </div>
                                    <div class="form-group">
                                        <label>Partner AS2 ID</label>
                                        <input type="text" name="ch_as2PartnerId" th:value="${channel?.as2PartnerId}" placeholder="PARTNER-AS2-ID">
                                    </div>
                                    <div class="form-group full">
                                        <label>AS2 Endpoint URL</label>
                                        <input type="text" name="ch_as2Url" th:value="${channel?.as2Url}" placeholder="https://partner.com/as2/receive">
                                    </div>
                                    <div class="form-group">
                                        <label>MDN Mode</label>
                                        <select name="ch_as2MdnMode">
                                            <option value="SYNC" th:selected="${channel?.as2MdnMode == 'SYNC'}">Synchronous</option>
                                            <option value="ASYNC" th:selected="${channel?.as2MdnMode == 'ASYNC'}">Asynchronous</option>
                                            <option value="NONE" th:selected="${channel?.as2MdnMode == 'NONE'}">None</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>MIC Algorithm</label>
                                        <select name="ch_as2MicAlgorithm">
                                            <option value="SHA-256" th:selected="${channel?.as2MicAlgorithm == 'SHA-256'}">SHA-256</option>
                                            <option value="SHA-1" th:selected="${channel?.as2MicAlgorithm == 'SHA-1'}">SHA-1</option>
                                            <option value="SHA-384" th:selected="${channel?.as2MicAlgorithm == 'SHA-384'}">SHA-384</option>
                                            <option value="SHA-512" th:selected="${channel?.as2MicAlgorithm == 'SHA-512'}">SHA-512</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Encryption Algorithm</label>
                                        <select name="ch_as2EncryptionAlgorithm">
                                            <option value="AES256" th:selected="${channel?.as2EncryptionAlgorithm == 'AES256'}">AES-256</option>
                                            <option value="AES128" th:selected="${channel?.as2EncryptionAlgorithm == 'AES128'}">AES-128</option>
                                            <option value="3DES" th:selected="${channel?.as2EncryptionAlgorithm == '3DES'}">3DES</option>
                                            <option value="NONE" th:selected="${channel?.as2EncryptionAlgorithm == 'NONE'}">None</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Security Options</label>
                                        <label style="font-weight:400;font-size:.82rem">
                                            <input type="checkbox" name="ch_as2SignMessages" th:checked="${channel?.as2SignMessages}"> Sign messages
                                        </label>
                                        <label style="font-weight:400;font-size:.82rem">
                                            <input type="checkbox" name="ch_as2EncryptMessages" th:checked="${channel?.as2EncryptMessages}"> Encrypt messages
                                        </label>
                                        <label style="font-weight:400;font-size:.82rem">
                                            <input type="checkbox" name="ch_as2RequestSignedMdn" th:checked="${channel?.as2RequestSignedMdn}"> Request signed MDN
                                        </label>
                                    </div>
                                    <div class="form-group full">
                                        <label>Our Certificate (PEM)</label>
                                        <textarea name="ch_as2LocalCertificate" th:text="${channel?.as2LocalCertificate}"
                                                  rows="5" placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----"
                                                  style="font-family:monospace;font-size:.78rem"></textarea>
                                    </div>
                                    <div class="form-group full">
                                        <label>Our Private Key (PEM)</label>
                                        <textarea name="ch_as2LocalPrivateKey" th:text="${channel?.as2LocalPrivateKey}"
                                                  rows="5" placeholder="-----BEGIN PRIVATE KEY-----&#10;...&#10;-----END PRIVATE KEY-----"
                                                  style="font-family:monospace;font-size:.78rem"></textarea>
                                    </div>
                                    <div class="form-group full">
                                        <label>Partner Certificate (PEM)</label>
                                        <textarea name="ch_as2PartnerCertificate" th:text="${channel?.as2PartnerCertificate}"
                                                  rows="5" placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----"
                                                  style="font-family:monospace;font-size:.78rem"></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- ===== HTTP Fields ===== -->
                            <div id="httpFields" style="display:none">
                                <div class="form-group full" style="margin-top:16px">
                                    <label style="font-size:.85rem;font-weight:700;color:var(--gray-800)">HTTP / Webhook Configuration</label>
                                </div>
                                <div class="form-grid">
                                    <div class="form-group full">
                                        <label>Endpoint URL</label>
                                        <input type="text" name="ch_httpUrl" th:value="${channel?.httpUrl}" placeholder="https://partner.com/api/edi/receive">
                                    </div>
                                    <div class="form-group">
                                        <label>HTTP Method</label>
                                        <select name="ch_httpMethod">
                                            <option value="POST" th:selected="${channel?.httpMethod == 'POST'}">POST</option>
                                            <option value="PUT" th:selected="${channel?.httpMethod == 'PUT'}">PUT</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Content-Type</label>
                                        <input type="text" name="ch_httpContentType" th:value="${channel?.httpContentType}" placeholder="application/edi-x12">
                                    </div>
                                    <div class="form-group full">
                                        <label>Authorization Header</label>
                                        <input type="text" name="ch_httpAuthHeader" th:value="${channel?.httpAuthHeader}" placeholder="Bearer eyJ... or Basic dXNl...">
                                    </div>
                                </div>
                            </div>

                            <!-- ===== Scheduling ===== -->
                            <div id="schedulingFields" style="display:none">
                                <div class="form-group full" style="margin-top:16px">
                                    <label style="font-size:.85rem;font-weight:700;color:var(--gray-800)">Scheduling</label>
                                </div>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label>Poll Interval (ms)</label>
                                        <input type="number" name="ch_pollIntervalMs" th:value="${channel?.pollIntervalMs}" placeholder="300000 (5 min)">
                                    </div>
                                    <div class="form-group">
                                        <label>Connection Timeout (ms)</label>
                                        <input type="number" name="ch_connectionTimeoutMs" th:value="${channel?.connectionTimeoutMs}" placeholder="10000">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"
                                th:text="${isEdit} ? 'Save Changes' : 'Create Partner'"></button>
                        <a th:href="@{/ui/partners}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function toggleProtocolFields() {
    var p = document.getElementById('protocolSelect').value;
    document.getElementById('sftpFields').style.display = (p === 'SFTP' || p === 'FTP') ? '' : 'none';
    document.getElementById('ftpOptions').style.display = (p === 'FTP') ? '' : 'none';
    document.getElementById('as2Fields').style.display = (p === 'AS2') ? '' : 'none';
    document.getElementById('httpFields').style.display = (p === 'HTTP') ? '' : 'none';
    document.getElementById('schedulingFields').style.display = (p !== '') ? '' : 'none';
    var lbl = document.getElementById('protocolLabel');
    if (lbl) lbl.textContent = p || 'SFTP';
}
toggleProtocolFields();
</script>
</body>
</html>
