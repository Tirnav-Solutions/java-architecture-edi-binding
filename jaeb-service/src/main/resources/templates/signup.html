<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — JAEB EDI Platform</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: var(--gray-900); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #fff; border-radius: 12px; padding: 40px; width: 440px; box-shadow: 0 25px 50px rgba(0,0,0,.25); }
        .login-brand { text-align: center; margin-bottom: 28px; }
        .login-brand h1 { font-size: 1.3rem; font-weight: 800; color: var(--gray-900); }
        .login-brand p { color: var(--gray-500); font-size: .82rem; margin-top: 4px; }
        .login-box .form-group { margin-bottom: 14px; }
        .login-box .form-group input { width: 100%; }
        .login-box .btn { width: 100%; justify-content: center; padding: 10px; font-size: .9rem; }
        .login-footer { text-align: center; margin-top: 20px; font-size: .82rem; color: var(--gray-500); }
        .login-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .section-label { font-size: .72rem; text-transform: uppercase; color: var(--gray-500); font-weight: 700; letter-spacing: .06em; margin: 20px 0 8px; padding-top: 12px; border-top: 1px solid var(--gray-200); }
    </style>
</head>
<body>
<div class="login-box">
    <div class="login-brand">
        <h1>&#9670; JAEB EDI Platform</h1>
        <p>Register your organization for EDI-as-a-Service</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/ui/signup}" method="post">
        <div class="section-label" style="margin-top:0;border:none;padding:0">Organization</div>
        <div class="form-group">
            <label>Organization ID *</label>
            <input type="text" name="tenantId" required placeholder="e.g. acme-corp (URL-safe, unique)"
                   pattern="[a-zA-Z0-9\-_]+" title="Letters, numbers, hyphens, underscores only">
        </div>
        <div class="form-group">
            <label>Company Name *</label>
            <input type="text" name="companyName" required placeholder="Acme Corporation">
        </div>

        <div class="section-label">Admin Account</div>
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="fullName" required placeholder="Jane Smith">
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" name="email" required placeholder="jane@acme-corp.com">
        </div>
        <div class="form-group">
            <label>Password *</label>
            <input type="password" name="password" required placeholder="Min 6 characters" minlength="6">
        </div>

        <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <div class="login-footer">
        Already have an account? <a th:href="@{/ui/login}">Sign in</a>
    </div>
</div>
</body>
</html>
