# ===========================
# PRODUCTION Profile
# ===========================
# External DB (PostgreSQL/MySQL recommended), strict security, caching, no debug.
# Run with: --spring.profiles.active=prod
#
# IMPORTANT: Override these with environment variables or a separate config file:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   EDI_SECURITY_API_KEY

server.port=8080

# Database: PostgreSQL (override via environment variables)
# spring.datasource.url=jdbc:postgresql://db-host:5432/jaeb_edi
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=${DB_USERNAME:jaeb}
# spring.datasource.password=${DB_PASSWORD:changeme}
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Fallback: H2 file-based (for single-server deployments)
spring.datasource.url=jdbc:h2:file:./data/edi-service-prod;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:prodSecurePassword}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 Console: DISABLED in production
spring.h2.console.enabled=false

# Thymeleaf: cache enabled
spring.thymeleaf.cache=true

# Logging: minimal, structured
logging.level.javax.edi=WARN
logging.level.org.springframework.web=WARN
logging.level.EDI_AUDIT=INFO
logging.level.root=WARN

# Security: ALL ENABLED
edi.security.api-key-enabled=true
edi.security.api-key=${EDI_API_KEY:change-this-to-a-strong-key}
edi.security.rate-limit-enabled=true
edi.security.rate-limit-per-minute=100

# Channel polling: enabled
edi.channel.polling-enabled=true
edi.channel.poll-interval-ms=300000
edi.channel.initial-delay-ms=60000
edi.sftp.polling-enabled=false

# Actuator: restrict exposure in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
