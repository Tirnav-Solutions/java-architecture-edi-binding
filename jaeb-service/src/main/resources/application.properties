# ===========================
# JAEB EDI-as-a-Service Platform
# ===========================
# Common properties shared across all profiles.
# Override per profile in application-{profile}.properties.
# Activate a profile: --spring.profiles.active=local|qa|prod

server.port=8080
spring.application.name=jaeb-edi-service

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=JAEB EDI-as-a-Service Platform
info.app.description=Multi-tenant EDI platform with parsing, generation, validation, 997 acknowledgement, partner onboarding, SFTP/FTP/AS2/HTTP channels, and SaaS portal
info.app.version=0.0.1-SNAPSHOT

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JPA (common)
spring.jpa.open-in-view=false

# ===========================
# Audit Logging
# ===========================
edi.audit.logging-enabled=true

# ===========================
# Channel Polling (common defaults)
# ===========================
edi.sftp.polling-enabled=false
edi.sftp.poll-interval-ms=300000
edi.sftp.initial-delay-ms=30000
edi.sftp.connection-timeout=10000
edi.channel.polling-enabled=false
edi.channel.poll-interval-ms=300000
edi.channel.initial-delay-ms=30000

# ===========================
# Default profile = local
# ===========================
spring.profiles.active=local